schema_version = "1.3"
artifacts = [
    { source = "/workspace/output/fit-assessment.json" },
    { source = "/workspace/output/deal-brief.md" },
]

[task]
name = "gustofied/deal-room-assess-commercial-fit"
description = "Assess whether a private GPU capacity offer fits a buyer requirement using a closed compute deal room."
keywords = ["compute-market", "deal-room", "procurement", "diligence", "gpu"]
[[task.authors]]
name = "Adam Sioud"

[metadata]
implementation_version = "0.1.1"
difficulty = "medium"
category = "professional-work"
tags = ["compute-bazaar-bench", "deal-room", "commercial-fit"]
difficulty_explanation = "The agent must reconcile a buyer mandate against conflicting technical, capacity, pricing, and contract evidence."
solution_explanation = "The reference work product identifies the current offer's material gaps, cites the controlling evidence, and recommends a bounded negotiation."
verification_explanation = "A separate deterministic verifier checks the typed work product, evidence coverage, material-issue coverage, next actions, and memo consistency under strict all-pass grading."

[verifier]
timeout_sec = 60.0
user = "root"
environment_mode = "separate"
collect = []

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/"

[agent]
timeout_sec = 600.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "*.openrouter.ai"]

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 4096
mcp_servers = []
workdir = "/workspace"

[solution.env]
