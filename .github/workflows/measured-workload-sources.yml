name: Measured workload source check

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: measured-workload-source-check
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  validate:
    name: Check StarSling evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Validate canonical evidence
        run: uv run sandbox-cost validate

      - name: Fail when upstream evidence needs review
        run: >-
          uv run sandbox-cost refresh-benchmark
          --output-root data/sandbox-cost
          --source-ref main
          --check
