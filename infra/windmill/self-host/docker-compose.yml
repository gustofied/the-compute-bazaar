x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: windmill
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windmill"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  windmill_server:
    image: ${WM_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: server
      BASE_URL: ${BASE_URL}
      SUPERADMIN_SECRET: ${SUPERADMIN_SECRET}
      SILENCE_HEALTH_LOGS: ${SILENCE_HEALTH_LOGS:-true}
    expose:
      - "8000"
    logging: *default-logging

  windmill_worker:
    image: ${WM_WORKER_IMAGE}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    privileged: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODE: worker
      WORKER_GROUP: default
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-3}
      PYTHON_PATH: /opt/compute-bazaar/.venv/bin/python
      PIP_LOCAL_DEPENDENCIES: the_compute_bazaar
      ENABLE_UNSHARE_PID: "true"
      DISABLE_NSJAIL: "true"
      SILENCE_HEALTH_LOGS: ${SILENCE_HEALTH_LOGS:-true}
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/windmill-labs/caddy-l4@sha256:70d73dddd7a6cbbc47161322731783c6014416fcf2ff12eb21e65c985024556e}
    restart: unless-stopped
    depends_on:
      - windmill_server
    environment:
      BASE_URL: ${BASE_URL}
      ADDRESS: ${ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "127.0.0.1:8081:80"
    logging: *default-logging

volumes:
  db_data:
  worker_dependency_cache:
  worker_logs:
  caddy_data:
