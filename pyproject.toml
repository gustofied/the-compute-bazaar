[project]
name = "the-compute-bazaar"
version = "0.1.0"
description = "tinkering with compute markets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "awscli>=1.45.30",
    "boto3>=1.41.0",
    "confluent-kafka>=2.12.2",
    "datafusion>=51.0.0",
    "fastapi>=0.137.1",
    "matplotlib>=3.10.8",
    "pillow>=12.0.0",
    "prime>=0.6.19",
    "pyarrow>=22.0.0",
    "requests>=2.33.1",
    "uvicorn[standard]>=0.49.0",
    "verifiers>=0.2.0",
]

[project.scripts]
compute-bazaar = "the_compute_bazaar.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = [
    "compute-bazaar-bench/evals/reliability-is-blind/dev_tests/fixtures",
    "external",
    "worktrees",
]
