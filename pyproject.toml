[project]
name = "the-compute-bazaar"
version = "0.1.0"
description = "A research workstation for compute markets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datafusion>=51.0.0",
    "fastapi>=0.137.1",
    "pydantic>=2.12.0,<3.0.0",
    "pyarrow>=22.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.33.1",
    "typer>=0.21.0,<1.0.0",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
market = [
    "matplotlib>=3.10.8",
    "pillow>=12.0.0",
]
s3 = [
    "boto3>=1.41.0",
]
worker = [
    "boto3>=1.41.0",
    "confluent-kafka>=2.12.2",
    "matplotlib>=3.10.8",
    "pillow>=12.0.0",
]

[project.scripts]
compute-bazaar = "the_compute_bazaar.cli:main"

[project.urls]
Repository = "https://github.com/gustofied/the-compute-bazaar"
Issues = "https://github.com/gustofied/the-compute-bazaar/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.0,<0.15.0",
]

[tool.ruff]
extend-exclude = [
    "compute-bazaar-bench/evals/reliability-is-blind/tooling/tests/fixtures",
    "external",
]
