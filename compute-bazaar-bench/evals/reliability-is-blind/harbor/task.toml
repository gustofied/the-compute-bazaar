schema_version = "1.3"
artifacts = [
    { source = "/market-artifacts/state.json", service = "market" },
]

[task]
name = "gustofied/reliability-is-blind"
description = "Choose compute suppliers across repeated deals using only collective delivery outcomes."
authors = [{ name = "Adam Sioud" }]
keywords = ["compute-market", "compute-brokerage", "supplier-reliability", "collective-incentives", "market-game"]

[verifier]
timeout_sec = 60.0
user = "root"
environment_mode = "separate"

[[verifier.collect]]
service = "market"
command = "python3 /opt/market/snapshot.py"
timeout_sec = 30.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 1024
workdir = "/"

[agent]
timeout_sec = 1800.0
user = "agent"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 2048
mcp_servers = []
workdir = "/workspace"

[environment.healthcheck]
command = "market ping"
interval_sec = 1.0
timeout_sec = 2.0
start_period_sec = 2.0
start_interval_sec = 0.5
retries = 10
