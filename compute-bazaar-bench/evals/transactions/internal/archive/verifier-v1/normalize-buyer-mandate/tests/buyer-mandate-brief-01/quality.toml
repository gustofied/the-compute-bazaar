[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/source-context.md", "/app/buyer-mandate-brief.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 20

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-001"
name = "c-001"
description = "Identifies the opportunity as CB-2026-041. FAIL if the ID is missing or incorrect."
type = "binary"

[[criterion]]
id = "C-002"
name = "c-002"
description = "Identifies Northstar Models, Inc. as the buyer and Maya Chen, Director of Infrastructure Procurement, as the mandate owner. FAIL if either is omitted or misidentified."
type = "binary"

[[criterion]]
id = "C-003"
name = "c-003"
description = "Uses the later procurement follow-up as controlling where it expressly updates the intake, while retaining the workload requirements for technical facts. FAIL if older conflicting entries are treated as controlling without explanation."
type = "binary"

[[criterion]]
id = "C-004"
name = "c-004"
description = "States the firm mandate as 1,024 NVIDIA B200 SXM GPUs. FAIL if the firm quantity or GPU model is wrong."
type = "binary"

[[criterion]]
id = "C-005"
name = "c-005"
description = "States that a further 1,024 GPUs are an option or expansion interest, not part of the firm mandate. FAIL if the optional quantity is omitted or presented as firm."
type = "binary"

[[criterion]]
id = "C-006"
name = "c-006"
description = "Converts the firm quantity to 128 eight-GPU nodes. FAIL if the node count is missing or incorrect."
type = "binary"

[[criterion]]
id = "C-007"
name = "c-007"
description = "Specifies dedicated eight-GPU HGX B200 nodes with SXM GPUs. FAIL if the configuration is materially incomplete or altered."
type = "binary"

[[criterion]]
id = "C-008"
name = "c-008"
description = "States that shared virtualization or fractional GPU service is not acceptable. FAIL if exclusivity is omitted or softened into a preference."
type = "binary"

[[criterion]]
id = "C-009"
name = "c-009"
description = "States the controlling ramp as 512 GPUs deliverable by January 15, 2027 and the remaining 512 by February 1, 2027. FAIL if either tranche, quantity, or date is wrong."
type = "binary"

[[criterion]]
id = "C-010"
name = "c-010"
description = "Flags the intake's January 1, 2027 full-delivery date as superseded by the later two-stage ramp. FAIL if the conflict is hidden or unresolved."
type = "binary"

[[criterion]]
id = "C-011"
name = "c-011"
description = "States the firm term as 18 months beginning with the first tranche service date. FAIL if the firm term is stated as 12 months or left unclear."
type = "binary"

[[criterion]]
id = "C-012"
name = "c-012"
description = "States that the buyer seeks one six-month extension option. FAIL if the extension option is omitted or described as automatic."
type = "binary"

[[criterion]]
id = "C-013"
name = "c-013"
description = "Flags the intake's 12-month term as superseded by the later 18-month instruction. FAIL if the contradiction is not surfaced."
type = "binary"

[[criterion]]
id = "C-014"
name = "c-014"
description = "States the acceptable geography as US East or US Midwest and preserves the US-only requirement. FAIL if either region or the domestic restriction is lost."
type = "binary"

[[criterion]]
id = "C-015"
name = "c-015"
description = "Classifies Virginia as a preference rather than a hard geographic requirement. FAIL if Virginia is omitted or made mandatory."
type = "binary"

[[criterion]]
id = "C-016"
name = "c-016"
description = "States the target all-in rate as $3.10 per GPU-hour, excluding taxes. FAIL if the target is missing or mislabeled as the absolute cap."
type = "binary"

[[criterion]]
id = "C-017"
name = "c-017"
description = "States the hard all-in rate cap as $3.35 per GPU-hour, excluding taxes. FAIL if the cap is missing or incorrect."
type = "binary"

[[criterion]]
id = "C-018"
name = "c-018"
description = "Clearly distinguishes the $3.10 target from the $3.35 walk-away cap. FAIL if the two are blended into one price requirement."
type = "binary"

[[criterion]]
id = "C-019"
name = "c-019"
description = "States that prepayment may not exceed three months of committed charges. FAIL if the maximum is omitted or stated as four months."
type = "binary"

[[criterion]]
id = "C-020"
name = "c-020"
description = "Flags the intake's four-month prepayment entry as superseded by the three-month limit in the procurement follow-up. FAIL if the conflict is not identified."
type = "binary"
