schema_version = "1.3"
artifacts = ["/app/buyer-mandate-brief.docx"]

[task]
name = "gustofied/normalize-buyer-mandate"
description = "Normalize a disorganized buyer mandate for a reserved GPU capacity transaction."
keywords = ["compute-market", "transactions", "procurement", "buyer-intake", "reserved-capacity", "rewardkit", "judge-grading"]
authors = [{ name = "Adam Sioud" }]

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]
build_timeout_sec = 1200.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[verifier.env]
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
LITELLM_DROP_PARAMS = "True"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
