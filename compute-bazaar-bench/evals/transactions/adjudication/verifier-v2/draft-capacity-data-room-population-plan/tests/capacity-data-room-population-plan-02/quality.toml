[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/capacity-data-room-population-plan-02/evidence.md", "/tests/source-context.md", "/app/capacity-data-room-population-plan.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 20

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-021"
name = "c-021"
description = "Maps buyer request IDs D-01 through D-24 to folders or plan items, including a clear treatment for requests that are not yet satisfied. FAIL if request coverage cannot be traced."
type = "binary"

[[criterion]]
id = "C-022"
name = "c-022"
description = "Assigns a named internal owner or responsible function to each material collection stream. FAIL if ownership is mostly absent or generic."
type = "binary"

[[criterion]]
id = "C-023"
name = "c-023"
description = "Assigns each item to Phase 1, Phase 2, clean-team review, or an explicit hold/escalation state. FAIL if phasing is not operational."
type = "binary"

[[criterion]]
id = "C-024"
name = "c-024"
description = "Defines access levels for ordinary buyer access, named-party access, clean-team access, and withheld material. FAIL if sensitive evidence is treated as universally visible."
type = "binary"

[[criterion]]
id = "C-025"
name = "c-025"
description = "Tracks whether evidence is ready, requires redaction, must be refreshed, is missing, or awaits third-party consent. FAIL if availability and collection status are not visible."
type = "binary"

[[criterion]]
id = "C-026"
name = "c-026"
description = "Sets practical target dates, including Phase 1 by August 17, 2026 and Phase 2 by August 24, 2026, or explains any necessary change. FAIL if the plan has no usable timetable."
type = "binary"

[[criterion]]
id = "C-027"
name = "c-027"
description = "Connects affected items to their actual dependencies: clean-team or release approval, third-party consent, engineering refresh, lender consent and release mechanics, or privilege and access review. FAIL if these dependencies are listed without the affected workstream or omitted."
type = "binary"

[[criterion]]
id = "C-028"
name = "c-028"
description = "Uses clean-team access for unredacted supplier pricing, utility pricing support, and financing materials where appropriate. FAIL if clean-team handling is absent."
type = "binary"

[[criterion]]
id = "C-029"
name = "c-029"
description = "Before release, maps each document to the relevant request ID and legal entity, marks executed, current, draft, and superseded versions, records each redaction and its basis, and does not mark stale or partly responsive material complete. FAIL if the plan permits an unclassified document dump."
type = "binary"

[[criterion]]
id = "C-030"
name = "c-030"
description = "Keeps unresolved, missing, stale, withheld, or partly responsive items visible with an owner, status, and next step or escalation. FAIL if unresolved items can disappear or be marked complete without support."
type = "binary"

[[criterion]]
id = "C-031"
name = "c-031"
description = "Identifies the central power conflict: the buyer asks for evidence of 24 MW by January 15, 2027, while the utility service material supports 12 MW on January 15 and the second 12 MW on April 1, 2027. FAIL if the mismatch or dates are missed."
type = "binary"

[[criterion]]
id = "C-032"
name = "c-032"
description = "Preserves both utility delivery milestones and calls for reconciliation rather than summarizing them as a single 24 MW commitment. FAIL if the staged utility position is flattened."
type = "binary"

[[criterion]]
id = "C-033"
name = "c-033"
description = "States that the current evidence does not substantiate 24 MW available at the initial service date and treats this as a gating transaction issue. FAIL if full initial power is presented as proven."
type = "binary"

[[criterion]]
id = "C-034"
name = "c-034"
description = "Includes the Blue Mesa site option despite its below-$500,000 classification because it is operationally critical to site control. FAIL if the plan excludes it mechanically by threshold."
type = "binary"

[[criterion]]
id = "C-035"
name = "c-035"
description = "Flags the October 31, 2026 Blue Mesa site-option exercise deadline, identifies Elena Park as owner, and keeps the required option action visible. FAIL if the deadline, owner, or need for action is omitted."
type = "binary"

[[criterion]]
id = "C-036"
name = "c-036"
description = "Identifies consent, assignment, or change-of-control review for the site option, utility service agreement, NorthSpan network agreement, PolarLoop cooling O&M agreement, and Crestline equipment credit agreement. FAIL if the five named agreements are not covered."
type = "binary"

[[criterion]]
id = "C-037"
name = "c-037"
description = "Creates or calls for a separate consent tracker covering the site option, utility service agreement, NorthSpan agreement, PolarLoop agreement, and Crestline equipment credit agreement, with an accountable owner, status, and next step. FAIL if the five consent workstreams are merely mentioned."
type = "binary"

[[criterion]]
id = "C-038"
name = "c-038"
description = "Identifies the cooling commissioning report as dated before the B200 expansion and therefore stale for the offered configuration. FAIL if it is treated as current."
type = "binary"

[[criterion]]
id = "C-039"
name = "c-039"
description = "Calls for Kestrel Infrastructure Advisory to refresh cooling and thermal commissioning evidence and makes the refresh a priority item. FAIL if no concrete refresh path is provided."
type = "binary"

[[criterion]]
id = "C-040"
name = "c-040"
description = "Identifies the conflict between the buyer's request for utility tariff and cost support and the operator instruction not to release unredacted tariff or energy-price schedules. FAIL if the conflict is not surfaced."
type = "binary"
