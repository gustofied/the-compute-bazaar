[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/capacity-data-room-population-plan-01/evidence.md", "/tests/source-context.md", "/app/capacity-data-room-population-plan.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 20

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-001"
name = "c-001"
description = "Identifies the matter as opportunity CB-2026-041 concerning Blue Mesa AI Campus and the proposed Northstar Models capacity transaction. FAIL if the matter is not identifiable."
type = "binary"

[[criterion]]
id = "C-002"
name = "c-002"
description = "States that the plan is a seller-side operating plan for collecting, reviewing, staging, and releasing diligence evidence, not a claim that every listed document already exists. FAIL if planned and available evidence are conflated."
type = "binary"

[[criterion]]
id = "C-003"
name = "c-003"
description = "Covers Alder Ridge Compute Holdings, Inc., Alder Ridge Compute Campus LLC, and Northline Compute Operations LLC, and explains why the project SPV and affiliate operator must be included despite the buyer request naming only Alder Ridge Compute LLC. FAIL if either relevant entity is excluded."
type = "binary"

[[criterion]]
id = "C-004"
name = "c-004"
description = "Provides an implementable hierarchical folder structure with numbered top-level folders and practical headings or subsections. FAIL if the output is only a loose document list; subfolders need not use a separate numbering scheme."
type = "binary"

[[criterion]]
id = "C-005"
name = "c-005"
description = "Includes a corporate, ownership, authority, and KYC section covering formation documents, ownership, signing authority, beneficial ownership, and the entity map. FAIL if this subject is absent."
type = "binary"

[[criterion]]
id = "C-006"
name = "c-006"
description = "Includes a site control section covering title, lease or option rights, surveys, easements, and landlord or counterparty consents. FAIL if site control is absent."
type = "binary"

[[criterion]]
id = "C-007"
name = "c-007"
description = "Includes a power section covering utility agreements, tariffs, invoices, delivery milestones, load studies, and electrical capacity evidence. FAIL if power diligence is materially incomplete."
type = "binary"

[[criterion]]
id = "C-008"
name = "c-008"
description = "Includes facility design, construction, permits, life-safety, and commissioning evidence. FAIL if the physical facility and approvals are omitted."
type = "binary"

[[criterion]]
id = "C-009"
name = "c-009"
description = "Includes hardware bills of material, purchase documents, serial or inventory schedules, title, liens, warranties, and delivery records. FAIL if hardware provenance and control are omitted."
type = "binary"

[[criterion]]
id = "C-010"
name = "c-010"
description = "Includes network topology, port allocation, carrier agreements, redundancy, and external connectivity evidence. FAIL if network diligence is absent."
type = "binary"

[[criterion]]
id = "C-011"
name = "c-011"
description = "Includes cooling design, capacity, water or coolant dependencies, O&M arrangements, and commissioning evidence. FAIL if cooling is absent."
type = "binary"

[[criterion]]
id = "C-012"
name = "c-012"
description = "Includes physical security, cybersecurity, SOC 2, data handling, encryption, access logging, and incident materials. FAIL if security and data controls are absent."
type = "binary"

[[criterion]]
id = "C-013"
name = "c-013"
description = "Includes operating procedures, staffing, maintenance, incident history, availability records, service levels, and acceptance testing. FAIL if operational readiness is omitted."
type = "binary"

[[criterion]]
id = "C-014"
name = "c-014"
description = "Includes commercial materials such as the offered capacity, pricing assumptions, buyer mandate, term sheet, draft agreement, and any existing capacity commitments. FAIL if commercial diligence is absent."
type = "binary"

[[criterion]]
id = "C-015"
name = "c-015"
description = "Includes financial statements, project budget, funding plan, debt documents, collateral, and credit support. FAIL if financial and financing evidence are absent."
type = "binary"

[[criterion]]
id = "C-016"
name = "c-016"
description = "Includes property, casualty, cyber, technology errors and omissions, and business interruption insurance evidence. FAIL if insurance is absent or limited to property coverage."
type = "binary"

[[criterion]]
id = "C-017"
name = "c-017"
description = "Includes litigation, claims, regulatory correspondence, permits, sanctions, export controls, and compliance materials. FAIL if disputes and regulatory diligence are absent."
type = "binary"

[[criterion]]
id = "C-018"
name = "c-018"
description = "Includes sustainability and environmental materials, including energy source, renewable matching claims, emissions, water use, and environmental reports. FAIL if this subject is absent."
type = "binary"

[[criterion]]
id = "C-019"
name = "c-019"
description = "Uses the two precedent indexes as structural references while adapting them to compute capacity rather than copying their irrelevant sections. FAIL if precedent use is absent or uncritical."
type = "binary"

[[criterion]]
id = "C-020"
name = "c-020"
description = "Presents the plan in a form that can serve as the working room index, with clear item descriptions and document-level actions. FAIL if the output cannot guide population work."
type = "binary"
