[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/buyer-mandate-brief-03/evidence.md", "/tests/source-context.md", "/app/buyer-mandate-brief.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 16

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-041"
name = "c-041"
description = "Calculates committed GPU-hours for the staged 18-month base term using a clearly stated service-date and day-count convention. Under a January 15 inclusive and July 15, 2028 exclusive convention, the result is 13,234,176 GPU-hours; another result passes if it follows a disclosed reasonable interpretation of 'by' and is arithmetically consistent. FAIL if the estimate is missing, opaque, or internally inconsistent."
type = "binary"

[[criterion]]
id = "C-042"
name = "c-042"
description = "Applies the $3.10 target rate correctly to the committed GPU-hours calculated under the brief's disclosed convention. The reference convention yields $41,025,945.60. FAIL if target-rate exposure is missing or the multiplication is materially incorrect."
type = "binary"

[[criterion]]
id = "C-043"
name = "c-043"
description = "Applies the $3.35 cap rate correctly to the committed GPU-hours calculated under the brief's disclosed convention. The reference convention yields $44,334,489.60. FAIL if cap-rate exposure is missing or the multiplication is materially incorrect."
type = "binary"

[[criterion]]
id = "C-044"
name = "c-044"
description = "Shows a reproducible calculation basis: staged quantities and dates, 24 hours per day, the assumed first service day, and the assumed 18-month end boundary. FAIL if totals are presented without the date-count convention or if an assumption is presented as a source fact."
type = "binary"

[[criterion]]
id = "C-045"
name = "c-045"
description = "If estimating deposit exposure, labels the monthly-hour convention as an assumption; otherwise states that deposit dollars remain open pending billing convention and final rate. FAIL if a precise deposit is asserted without its assumptions."
type = "binary"

[[criterion]]
id = "C-046"
name = "c-046"
description = "States that egress pricing remains open, implementation charges were not discussed, and operating pass-throughs must stay within the all-in cap. FAIL if these open-charge points are assumed resolved or omitted."
type = "binary"

[[criterion]]
id = "C-047"
name = "c-047"
description = "Flags extension-option pricing and the exercise deadline as open. FAIL if extension economics are invented or left unaddressed."
type = "binary"

[[criterion]]
id = "C-048"
name = "c-048"
description = "Requests confirmation of the contracting provider entity and its legal control over the offered capacity. FAIL if counterparty identity and capacity control are not raised."
type = "binary"

[[criterion]]
id = "C-049"
name = "c-049"
description = "Requests evidence of hardware title, liens, or financing encumbrances. FAIL if title and lien diligence are omitted."
type = "binary"

[[criterion]]
id = "C-050"
name = "c-050"
description = "Requests evidence supporting the delivery schedule, including utility service and facility commissioning status. FAIL if delivery substantiation is omitted."
type = "binary"

[[criterion]]
id = "C-051"
name = "c-051"
description = "Requests network topology, port allocation, and carrier evidence sufficient to verify the fabric and ingress requirements. FAIL if network proof is omitted."
type = "binary"

[[criterion]]
id = "C-052"
name = "c-052"
description = "Flags the NCCL reference result and pass threshold as an acceptance item still to be agreed. FAIL if the benchmark is treated as complete without a threshold."
type = "binary"

[[criterion]]
id = "C-053"
name = "c-053"
description = "Keeps unresolved terms visibly unresolved and does not invent provider, pricing, delivery, or diligence facts. FAIL for any material unsupported assertion."
type = "binary"

[[criterion]]
id = "C-054"
name = "c-054"
description = "Uses a clear professional structure that separates mandate summary, controlling terms, technical requirements, conflicts, calculations, and open items. FAIL if the memo is materially difficult to use."
type = "binary"

[[criterion]]
id = "C-055"
name = "c-055"
description = "Attributes material facts to the intake, workload brief, or dated procurement follow-up so a reviewer can trace the source hierarchy. FAIL if controlling facts are not source-grounded."
type = "binary"

[[criterion]]
id = "C-056"
name = "c-056"
description = "Ends with prioritized next actions covering supplier evidence, commercial clarification, technical validation, and acceptance definition. FAIL if the memo has no actionable follow-up."
type = "binary"
