[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/capacity-agreement-deviation-report-02/evidence.md", "/tests/source-context.md", "/app/capacity-agreement-deviation-report.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 20

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-021"
name = "c-021"
description = "ISSUE_006: Classifies both deposit changes as adverse and unagreed, identifies the four-month amount as a buyer checklist hard stop, and recommends restoring the three-month refundable and creditable structure. FAIL if status, risk, or remedy is missing."
type = "binary"

[[criterion]]
id = "C-022"
name = "c-022"
description = "ISSUE_007: Identifies that the term sheet provides delay credits of $300,000 per week capped at $2.4 million, while the agreement provides $150,000 per week capped at $2.5 million. FAIL if either rate or cap is missed."
type = "binary"

[[criterion]]
id = "C-023"
name = "c-023"
description = "ISSUE_007: Flags the agreement's internal statement that ten weeks at $150,000 per week equals the $2.5 million cap, when it equals $1.5 million. FAIL if the arithmetic inconsistency is missed."
type = "binary"

[[criterion]]
id = "C-024"
name = "c-024"
description = "ISSUE_007: Identifies that the buyer's termination right moves from eight weeks of delay in the term sheet to ten weeks in the agreement. FAIL if the exit delay is missed."
type = "binary"

[[criterion]]
id = "C-025"
name = "c-025"
description = "ISSUE_007: Classifies the weaker weekly credit and later termination right as adverse and unexplained; it does not treat the nominally higher cap as curing the weaker remedy. FAIL if the economics or buyer impact are misread."
type = "binary"

[[criterion]]
id = "C-026"
name = "c-026"
description = "ISSUE_007: Recommends restoring $300,000 per week, the $2.4 million cap, the eight-week termination point, and internally consistent arithmetic. FAIL if the correction is incomplete."
type = "binary"

[[criterion]]
id = "C-027"
name = "c-027"
description = "ISSUE_008: Identifies that the term sheet requires at least one 400 Gb/s fabric endpoint per GPU, while the agreement only promises commercially reasonable high-speed fabric and permits topology changes. FAIL if the objective bandwidth obligation is missed."
type = "binary"

[[criterion]]
id = "C-028"
name = "c-028"
description = "ISSUE_008: Classifies the fabric change as adverse and a buyer checklist hard stop because performance cannot be accepted against an undefined standard. FAIL if the risk is understated."
type = "binary"

[[criterion]]
id = "C-029"
name = "c-029"
description = "ISSUE_008: Recommends restoring the 400 Gb/s per-GPU floor and tying topology and port-map evidence to acceptance. FAIL if no measurable remedy is proposed."
type = "binary"

[[criterion]]
id = "C-030"
name = "c-030"
description = "ISSUE_009: Identifies that the term sheet requires 6 PiB usable storage at 1.2 TB/s read and 800 GB/s write, while Section 6.2 only says the system is designed for up to those figures under representative conditions. Section 6.3 does preserve at least 200 Gb/s external ingress and must not be reported as missing. FAIL if the storage qualification is missed or ingress is mischaracterized."
type = "binary"

[[criterion]]
id = "C-031"
name = "c-031"
description = "ISSUE_009: Classifies the storage wording as adverse and unexplained because it converts measurable performance commitments into qualified design targets. FAIL if the buyer risk is understated."
type = "binary"

[[criterion]]
id = "C-032"
name = "c-032"
description = "ISSUE_009: Recommends replacing the qualified 'designed for,' 'up to,' and 'representative conditions' storage language with measurable read and write throughput obligations and a confirmed test method, while preserving the agreement's 200 Gb/s external-ingress commitment. FAIL if the proposed fix remains non-measurable or treats ingress as omitted."
type = "binary"

[[criterion]]
id = "C-033"
name = "c-033"
description = "ISSUE_010: Identifies that the term sheet permits only B200 or later equal-or-better substitutions with Northstar's written consent, while the agreement permits H200 or similar-memory devices without consent. FAIL if the substitution gap is missed."
type = "binary"

[[criterion]]
id = "C-034"
name = "c-034"
description = "ISSUE_010: Classifies the substitution clause as materially adverse and contrary to the negotiation summary's express no-H200 instruction. FAIL if status or impact is wrong."
type = "binary"

[[criterion]]
id = "C-035"
name = "c-035"
description = "ISSUE_010: Recommends limiting substitution to B200 or later-generation equal-or-better hardware with Northstar's prior written consent. FAIL if the remedy permits unilateral downgrade."
type = "binary"

[[criterion]]
id = "C-036"
name = "c-036"
description = "ISSUE_011: Identifies that the agreed acceptance package requires a 72-hour burn-in, serial and inventory attestation, and NCCL performance of at least 92% of the agreed reference, while the agreement uses provider-standard tests and 24-hour deemed acceptance. FAIL if the package deviation is missed."
type = "binary"

[[criterion]]
id = "C-037"
name = "c-037"
description = "ISSUE_011: Classifies the weakened acceptance language as adverse and a condition-to-sign issue because it removes objective proof of the delivered cluster. FAIL if the risk is understated."
type = "binary"

[[criterion]]
id = "C-038"
name = "c-038"
description = "ISSUE_011: Recommends inserting the burn-in, inventory attestation, 92% NCCL threshold, cure and retest process, and no deemed acceptance before testing completes. FAIL if the remedy is incomplete."
type = "binary"

[[criterion]]
id = "C-039"
name = "c-039"
description = "ISSUE_012: Identifies that planned maintenance moves from no more than eight hours per month with seven days' notice to twelve hours with five days' notice. FAIL if either change is missed."
type = "binary"

[[criterion]]
id = "C-040"
name = "c-040"
description = "ISSUE_012: Classifies the maintenance change as adverse and unexplained and notes that the allowance rises by 50% while notice falls by two days. FAIL if impact is omitted or materially misstated."
type = "binary"
