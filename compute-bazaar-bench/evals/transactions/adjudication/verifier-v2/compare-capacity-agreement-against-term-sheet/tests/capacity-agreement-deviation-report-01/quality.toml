[judge]
judge = "openrouter/openai/gpt-5.4"
files = ["/tests/capacity-agreement-deviation-report-01/evidence.md", "/tests/source-context.md", "/app/capacity-agreement-deviation-report.docx.md"]
prompt_template = "../judge-prompt.md"
weight = 20

[scoring]
aggregation = "weighted_mean"

[[criterion]]
id = "C-001"
name = "c-001"
description = "ISSUE_001: Identifies that the term sheet and agreement Section 4.1 state 2% annual price escalation, while Schedule 2 applies 3%. FAIL if the discrepancy is not identified."
type = "binary"

[[criterion]]
id = "C-002"
name = "c-002"
description = "ISSUE_001: Flags the 2% text versus 3% schedule as an internal inconsistency within the draft agreement, not only a term-sheet deviation. FAIL if the internal drafting conflict is missed."
type = "binary"

[[criterion]]
id = "C-003"
name = "c-003"
description = "ISSUE_001: Quantifies the second contract-year price as $3.162 per GPU-hour at 2% versus $3.193 at 3%, a $0.031 per GPU-hour difference before rounding. FAIL if no reliable quantification is provided."
type = "binary"

[[criterion]]
id = "C-004"
name = "c-004"
description = "ISSUE_001: Classifies the 3% schedule escalation as adverse to Northstar and unexplained. FAIL if it is treated as agreed or favorable to the buyer."
type = "binary"

[[criterion]]
id = "C-005"
name = "c-005"
description = "ISSUE_001: Recommends correcting Schedule 2 to 2% and checking every derived price. FAIL if no concrete correction is proposed."
type = "binary"

[[criterion]]
id = "C-006"
name = "c-006"
description = "ISSUE_002: Identifies the delivery change from all 1,024 GPUs by January 15, 2027 in the term sheet to 512 on January 15 and 512 on February 1 in the agreement. FAIL if the staged ramp is missed."
type = "binary"

[[criterion]]
id = "C-007"
name = "c-007"
description = "ISSUE_002: Notes that the staged delivery was expressly accepted in the negotiation summary and should not be characterized as an unexplained drafting error. FAIL if its negotiated status is wrong."
type = "binary"

[[criterion]]
id = "C-008"
name = "c-008"
description = "ISSUE_002: Classifies the staged ramp as adverse to Northstar's original term-sheet position but agreed, and recommends confirming that billing begins only as each tranche is accepted. FAIL if impact or billing treatment is omitted."
type = "binary"

[[criterion]]
id = "C-009"
name = "c-009"
description = "ISSUE_003: Identifies the availability threshold change from 99.5% in the term sheet to 99.3% in the draft agreement. FAIL if the change is missed."
type = "binary"

[[criterion]]
id = "C-010"
name = "c-010"
description = "ISSUE_003: Notes that Northstar accepted 99.3% in the negotiation summary only as part of a package preserving the agreed service-credit economics. FAIL if the condition is omitted."
type = "binary"

[[criterion]]
id = "C-011"
name = "c-011"
description = "ISSUE_003: Classifies the lower availability threshold as adverse but intentionally negotiated, not an error to revert in isolation. FAIL if its status or buyer impact is misstated."
type = "binary"

[[criterion]]
id = "C-012"
name = "c-012"
description = "ISSUE_004: Identifies that the agreed service credit was 12% of monthly committed charges per percentage point below 99.3%, while the agreement provides 8%. FAIL if the rate deviation is missed."
type = "binary"

[[criterion]]
id = "C-013"
name = "c-013"
description = "ISSUE_004: Identifies that the agreed monthly service-credit cap was 50% of monthly committed charges, while the agreement caps credits at 25%. FAIL if the cap deviation is missed."
type = "binary"

[[criterion]]
id = "C-014"
name = "c-014"
description = "ISSUE_004: Classifies the reduced credit rate and cap as adverse and contrary to the negotiated availability package, and recommends restoring both figures. FAIL if the package connection or remedy is missing."
type = "binary"

[[criterion]]
id = "C-015"
name = "c-015"
description = "ISSUE_005: Identifies that the term sheet includes power costs in the GPU-hour rate up to $0.075/kWh and permits only documented excess above that threshold, while the agreement passes through all utility charges, taxes, riders, and surcharges. FAIL if the allocation change is missed."
type = "binary"

[[criterion]]
id = "C-016"
name = "c-016"
description = "ISSUE_005: Notes that the agreement omits the term sheet's at-cost limitation, supporting invoice evidence, and 30-day advance notice for power pass-through. FAIL if these controls are not identified."
type = "binary"

[[criterion]]
id = "C-017"
name = "c-017"
description = "ISSUE_005: Classifies the broader power pass-through as materially adverse and potentially inconsistent with the $3.35 all-in mandate cap. FAIL if the buyer exposure is understated."
type = "binary"

[[criterion]]
id = "C-018"
name = "c-018"
description = "ISSUE_005: Recommends reinstating the threshold, at-cost evidence, notice, audit right, and an express relationship to the all-in cap. FAIL if the response is vague."
type = "binary"

[[criterion]]
id = "C-019"
name = "c-019"
description = "ISSUE_006: Identifies that the term sheet caps the security deposit at three months of committed charges, while the agreement requires four months. FAIL if the amount change is missed."
type = "binary"

[[criterion]]
id = "C-020"
name = "c-020"
description = "ISSUE_006: Identifies that the term sheet makes the deposit creditable against final invoices and refundable, while the agreement describes it as non-refundable security. FAIL if the treatment change is missed."
type = "binary"
