<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The Compute Bazaar architecture</title>
  <desc id="desc">Market data, Fleet operations, and Eval runs meet in DataFusion and the Terminal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#303030"/>
    </marker>
    <style>
      .canvas { fill: #fff; }
      .group { fill: none; stroke: #9a9a9a; stroke-width: 1.5; }
      .box { fill: #f3f3f3; stroke: #303030; stroke-width: 1.6; }
      .line { fill: none; stroke: #303030; stroke-width: 1.7; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #303030; stroke-width: 1.7; }
      .heading { fill: #222; font: 600 18px 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: 1.5px; }
      .label { fill: #171717; font: 500 18px 'SFMono-Regular', Menlo, Consolas, monospace; }
      .small { fill: #555; font: 400 14px 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="620"/>

  <rect class="group" x="45" y="42" width="330" height="300"/>
  <text class="heading" x="65" y="72">MARKET</text>
  <rect class="box" x="95" y="98" width="230" height="48" rx="4"/>
  <text class="label" x="210" y="128" text-anchor="middle">Provider APIs</text>
  <path class="line" d="M210 146v34"/>
  <rect class="box" x="75" y="180" width="270" height="54" rx="4"/>
  <line x1="165" y1="180" x2="165" y2="234" stroke="#aaa"/>
  <line x1="255" y1="180" x2="255" y2="234" stroke="#aaa"/>
  <text class="label" x="120" y="213" text-anchor="middle">Bronze</text>
  <text class="label" x="210" y="213" text-anchor="middle">Silver</text>
  <text class="label" x="300" y="213" text-anchor="middle">Gold</text>
  <path class="line" d="M210 234v34"/>
  <rect class="box" x="95" y="268" width="230" height="48" rx="4"/>
  <text class="label" x="210" y="298" text-anchor="middle">Public lake</text>

  <rect class="group" x="435" y="42" width="330" height="300"/>
  <text class="heading" x="455" y="72">FLEET</text>
  <rect class="box" x="485" y="98" width="230" height="48" rx="4"/>
  <text class="label" x="600" y="128" text-anchor="middle">Offer / SSH host</text>
  <path class="line" d="M600 146v34"/>
  <rect class="box" x="485" y="180" width="230" height="48" rx="4"/>
  <text class="label" x="600" y="210" text-anchor="middle">Allocation</text>
  <path class="line" d="M600 228v34"/>
  <rect class="box" x="485" y="262" width="230" height="54" rx="4"/>
  <text class="label" x="600" y="285" text-anchor="middle">Monitor</text>
  <text class="small" x="600" y="304" text-anchor="middle">workloads</text>

  <rect class="group" x="825" y="42" width="330" height="300"/>
  <text class="heading" x="845" y="72">EVAL</text>
  <rect class="box" x="875" y="98" width="230" height="48" rx="4"/>
  <text class="label" x="990" y="128" text-anchor="middle">Harbor</text>
  <path class="line" d="M990 146v34"/>
  <rect class="box" x="875" y="180" width="230" height="48" rx="4"/>
  <text class="label" x="990" y="210" text-anchor="middle">Tasks</text>
  <path class="line" d="M990 228v34"/>
  <rect class="box" x="875" y="262" width="230" height="54" rx="4"/>
  <text class="label" x="990" y="285" text-anchor="middle">Jobs</text>
  <text class="small" x="990" y="304" text-anchor="middle">trials</text>

  <path class="branch" d="M210 342v62h390M600 342v62"/>
  <path class="line" d="M600 404v24"/>
  <rect class="box" x="465" y="428" width="270" height="56" rx="4"/>
  <text class="label" x="600" y="462" text-anchor="middle">DataFusion</text>

  <path class="line" d="M600 484v34"/>
  <path class="line" d="M990 342v154H770v42h-35"/>
  <rect class="box" x="465" y="518" width="270" height="68" rx="4"/>
  <text class="label" x="600" y="546" text-anchor="middle">CLI / Terminal</text>
  <text class="small" x="600" y="570" text-anchor="middle">Data · Fleet · Eval · Trade</text>

  <rect class="box" x="825" y="518" width="230" height="68" rx="4"/>
  <text class="label" x="940" y="546" text-anchor="middle">Agents</text>
  <text class="small" x="940" y="570" text-anchor="middle">ACP</text>
  <path class="line" d="M825 552h-90"/>
</svg>
