<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 360" role="img" aria-labelledby="title description">
  <title id="title">Compute Bazaar Fleet flow</title>
  <desc id="description">A live offer is checked, rented, and recorded as an allocation, or an SSH host is attached directly. Both become a Fleet node that can be inspected, checked, monitored, and used for workloads.</desc>
  <style>
    .box {
      fill: none;
      stroke: #6d93af;
      stroke-width: 3;
    }
    .line {
      fill: none;
      stroke: #6d93af;
      stroke-width: 3;
      marker-end: url(#arrow);
    }
    .label {
      fill: #315f82;
      font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      font-size: 27px;
      font-weight: 400;
      text-anchor: middle;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d93af"/>
    </marker>
  </defs>

  <rect class="box" x="25" y="45" width="170" height="82"/>
  <text class="label" x="110" y="95">Live offer</text>

  <rect class="box" x="225" y="45" width="190" height="82"/>
  <text class="label" x="320" y="95">Check offer</text>

  <rect class="box" x="445" y="45" width="150" height="82"/>
  <text class="label" x="520" y="95">Rent</text>

  <rect class="box" x="625" y="45" width="180" height="82"/>
  <text class="label" x="715" y="95">Allocation</text>

  <rect class="box" x="225" y="230" width="170" height="82"/>
  <text class="label" x="310" y="280">SSH host</text>

  <rect class="box" x="425" y="230" width="150" height="82"/>
  <text class="label" x="500" y="280">Attach</text>

  <rect class="box" x="835" y="108" width="190" height="96"/>
  <text class="label" x="930" y="165">Fleet node</text>

  <rect class="box" x="1090" y="115" width="150" height="82"/>
  <text class="label" x="1165" y="165">Inspect</text>

  <rect class="box" x="1295" y="115" width="150" height="82"/>
  <text class="label" x="1370" y="165">Doctor</text>

  <rect class="box" x="1500" y="45" width="260" height="82"/>
  <text class="label" x="1630" y="95">Monitor</text>

  <rect class="box" x="1500" y="230" width="260" height="82"/>
  <text class="label" x="1630" y="280">Workloads</text>

  <path class="line" d="M195 86 H225"/>
  <path class="line" d="M415 86 H445"/>
  <path class="line" d="M595 86 H625"/>
  <path class="line" d="M395 271 H425"/>
  <path class="line" d="M805 86 H815 V137 H835"/>
  <path class="line" d="M575 271 H805 V176 H835"/>
  <path class="line" d="M1025 156 H1090"/>
  <path class="line" d="M1240 156 H1295"/>
  <path class="line" d="M1445 156 H1475 V86 H1500"/>
  <path class="line" d="M1445 156 H1475 V271 H1500"/>
</svg>
