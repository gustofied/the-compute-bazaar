<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 360" role="img" aria-labelledby="title description">
  <title id="title">Compute Bazaar Fleet flow</title>
  <desc id="description">A live offer passes through preflight and allocation, or an SSH host is attached directly. Both become a Fleet node that can be inspected, checked, monitored, and used for workloads.</desc>
  <style>
    :root {
      --line: #6d93af;
      --text: #315f82;
      --muted: #6d93af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --line: #91aecb;
        --text: #b7d0e6;
        --muted: #91aecb;
      }
    }
    .box {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
    }
    .line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      marker-end: url(#arrow);
    }
    .label {
      fill: var(--text);
      font: 500 27px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-anchor: middle;
    }
    .small {
      fill: var(--muted);
      font: 400 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-anchor: middle;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect class="box" x="35" y="45" width="190" height="82"/>
  <text class="label" x="130" y="95">Live offer</text>

  <rect class="box" x="285" y="45" width="190" height="82"/>
  <text class="label" x="380" y="95">Preflight</text>

  <rect class="box" x="535" y="45" width="190" height="82"/>
  <text class="label" x="630" y="95">Allocation</text>

  <rect class="box" x="285" y="230" width="190" height="82"/>
  <text class="label" x="380" y="280">SSH host</text>

  <rect class="box" x="535" y="230" width="190" height="82"/>
  <text class="label" x="630" y="280">Attach</text>

  <rect class="box" x="805" y="108" width="210" height="96"/>
  <text class="label" x="910" y="165">Fleet node</text>

  <rect class="box" x="1095" y="115" width="150" height="82"/>
  <text class="label" x="1170" y="165">Inspect</text>

  <rect class="box" x="1305" y="115" width="150" height="82"/>
  <text class="label" x="1380" y="165">Doctor</text>

  <rect class="box" x="1515" y="45" width="240" height="82"/>
  <text class="label" x="1635" y="95">Monitor</text>

  <rect class="box" x="1515" y="230" width="240" height="82"/>
  <text class="label" x="1635" y="280">Workloads</text>

  <path class="line" d="M225 86 H285"/>
  <path class="line" d="M475 86 H535"/>
  <path class="line" d="M475 271 H535"/>
  <path class="line" d="M725 86 H770 V137 H805"/>
  <path class="line" d="M725 271 H770 V176 H805"/>
  <path class="line" d="M1015 156 H1095"/>
  <path class="line" d="M1245 156 H1305"/>
  <path class="line" d="M1455 156 H1485 V86 H1515"/>
  <path class="line" d="M1455 156 H1485 V271 H1515"/>
</svg>
